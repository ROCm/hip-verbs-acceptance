#
# Build-and-test gate: builds the harness with GCC 11 (the README's stated
# minimum and the compiler family on Ruby CoCo compute nodes) and GCC 13,
# across the synthetic and full build configurations, then runs the unit
# tests and the harness self-test. No GPU or RDMA NIC is available on the
# runner; both configurations build with -DACCEPT_WITH_HIP /
# -DACCEPT_WITH_IBVERBS resolving their runtime symbols via dlopen, so the
# binary builds and `hva --list` runs without hardware.

name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.toolchain.image }}
      # The self-test SIGKILLs a test's grandchild and then checks that its pid
      # is gone. Without an init process as PID 1, nothing reaps the orphaned
      # zombie and `kill -0` still succeeds on it.
      options: --init
    strategy:
      fail-fast: false
      matrix:
        # Each image's default g++ is the version named; both ship cmake >= 3.20.
        toolchain:
          - name: gcc-11
            image: "ubuntu:22.04"
          - name: gcc-13
            image: "ubuntu:24.04"
        config:
          - name: synthetic
            cmake_flags: -DACCEPT_WITH_HIP=OFF -DACCEPT_WITH_IBVERBS=OFF
          - name: full
            cmake_flags: -DACCEPT_WITH_HIP=ON -DACCEPT_WITH_IBVERBS=ON
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        # procps provides pgrep and ps for the self-test's leak checks.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            g++ make cmake python3 procps

      - name: Toolchain versions
        run: |
          g++ --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build-${{ matrix.config.name }}
          ${{ matrix.config.cmake_flags }}
          -DACCEPT_WERROR=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-${{ matrix.config.name }} -j

      - name: Unit tests
        run: ./build-${{ matrix.config.name }}/unit_tests

      - name: hva --list
        run: ./build-${{ matrix.config.name }}/hva --list

      - name: Harness self-test
        if: matrix.config.name == 'synthetic'
        run: bash scripts/selftest.sh ./build-${{ matrix.config.name }}/hva .
