#
# Weekly security scan: the full ROCm security baseline over the whole
# repository, with SARIF findings uploaded to the Security tab. Complements
# pr-security-scan.yml, which scans only what a pull request changed.

name: Security scan (Weekly)

on:
  schedule:
    - cron: "0 10 * * 6" # Saturdays, 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    # Only the job that uploads SARIF gets write access to code scanning.
    # actions: read is what SARIF upload needs to read the run in a private
    # repository; it is harmless once the repository is public.
    name: Security scan
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@35d3060c4b2ed48f950f85bd414a1302a431fc0b # v1.0.8
    with:
      scan_mode: all
      report_formats: sarif
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml
