# PR security gate: the ROCm security baseline scanners on every pull request.
# The set of scanners lives in rocm-security-gh's security-baseline.yml, so
# scanners added there are picked up here without touching this file.

name: Security scan (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    # actions: read + pull-requests: write let the baseline post its findings
    # comment; a reusable workflow cannot grant itself more than this job does.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    name: Security scan
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@35d3060c4b2ed48f950f85bd414a1302a431fc0b # v1.0.8
    with:
      report_formats: human
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml
