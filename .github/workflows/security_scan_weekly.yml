#
# Weekly security scan: the full ROCm security baseline over the whole
# repository, with SARIF findings uploaded to the Security tab. Complements
# security_scan_pr.yml, which scans only what a pull request changed.

name: Security scan (Weekly)

on:
  schedule:
    - cron: "0 10 * * 6" # Saturdays, 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    # Only the job that uploads SARIF gets write access to code scanning.
    # actions: read is what SARIF upload needs to read the run in a private
    # repository; it is harmless once the repository is public.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@228e62369c5d8b677215f8a112ea0c8e8119c58f # v1.0.6
    with:
      scan_mode: all
      report_formats: sarif
